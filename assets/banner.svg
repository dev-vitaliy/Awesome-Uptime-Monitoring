<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#080d1e" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <style>
      @keyframes ping {
        0% { r: 6px; opacity: 0.9; }
        50% { r: 24px; opacity: 0.3; }
        100% { r: 38px; opacity: 0; }
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1200;
        }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      .ping-circle-1 {
        animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .ping-circle-2 {
        animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
        animation-delay: 1.2s;
      }
      .ecg-line {
        stroke-dasharray: 20 6;
        animation: dash 35s linear infinite;
      }
      .pill-float-1 {
        animation: floatPill 4s ease-in-out infinite;
      }
      .pill-float-2 {
        animation: floatPill 5s ease-in-out infinite reverse;
      }
      .pill-float-3 {
        animation: floatPill 4.5s ease-in-out infinite 0.5s;
      }
      .radar-line {
        transform-origin: 1080px 180px;
        animation: radarSweep 6s linear infinite;
      }
      .glow-pulse {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Ambient background glow blobs -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="950" cy="140" r="180" fill="#10b981" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="80" r="220" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Dynamic Radar / Ping in Background (Right side) -->
  <g opacity="0.6">
    <circle cx="1060" cy="180" r="80" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
    <circle cx="1060" cy="180" r="50" stroke="#0e7490" stroke-width="1.5" stroke-opacity="0.6" fill="none" />
    <circle cx="1060" cy="180" r="20" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7" fill="none" />
    <circle cx="1060" cy="180" r="5" fill="#10b981" />
    <circle class="ping-circle-1" cx="1060" cy="180" r="8" stroke="#10b981" stroke-width="2" fill="none" />
    <circle class="ping-circle-2" cx="1060" cy="180" r="8" stroke="#06b6d4" stroke-width="1.5" fill="none" />
  </g>

  <!-- Background Animated ECG Heartbeat Line -->
  <path class="ecg-line" d="M 0 310 L 180 310 L 210 310 L 225 275 L 240 335 L 255 255 L 270 330 L 285 305 L 300 310 L 520 310 L 535 285 L 550 330 L 565 260 L 580 340 L 595 295 L 610 310 L 820 310 L 835 280 L 850 330 L 865 265 L 880 335 L 895 300 L 910 310 L 1200 310" 
        stroke="url(#pulseGrad)" stroke-width="2.5" fill="none" opacity="0.75" />

  <!-- Animated Ambient Floating Status Pills (Behind text layer) -->
  <g class="pill-float-1" opacity="0.85">
    <rect x="70" y="55" width="160" height="34" rx="17" fill="url(#badgeGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="90" cy="72" r="5" fill="#10b981" filter="url(#softGlow)" />
    <text x="104" y="77" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">99.999% UPTIME</text>
  </g>

  <g class="pill-float-2" opacity="0.85">
    <rect x="940" y="55" width="190" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="960" cy="72" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="974" y="77" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">HTTP 200 OK • 18ms</text>
  </g>

  <g class="pill-float-3" opacity="0.85">
    <rect x="980" y="270" width="165" height="30" rx="15" fill="url(#badgeGrad)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="998" cy="285" r="4.5" fill="#a78bfa" />
    <text x="1010" y="289" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">MULTI-REGION PROBES</text>
  </g>

  <g class="pill-float-1" opacity="0.85">
    <rect x="70" y="270" width="170" height="30" rx="15" fill="url(#badgeGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="88" cy="285" r="4.5" fill="#34d399" />
    <text x="100" y="289" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">STATUS: OPERATIONAL</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed clean in front of animations) -->
  <g transform="translate(600, 165)">
    <!-- Top Micro Tag -->
    <g transform="translate(0, -68)">
      <rect x="-140" y="-13" width="280" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="-118" cy="0" r="4.5" fill="#10b981" />
      <text x="-106" y="4" text-anchor="start" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="10" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Uptime Monitoring
    </text>

    <!-- Subtitle -->
    <text x="0" y="46" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
      Curated List of SaaS Platforms &amp; Self-Hosted Open-Source GitHub Projects
    </text>

    <!-- Feature Highlights -->
    <text x="0" y="74" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="0.4">
      Endpoint Probing • Synthetic Transactions • Public Status Pages • Heartbeats • Alerting
    </text>
  </g>

</svg>
